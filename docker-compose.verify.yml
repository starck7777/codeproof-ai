services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: codeproof
      POSTGRES_PASSWORD: codeproof-test-only # pragma: allowlist secret - disposable verifier password
      POSTGRES_DB: verification
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeproof"]
      interval: 1s
      retries: 30
  redis:
    image: redis:7.4.1-alpine
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30
